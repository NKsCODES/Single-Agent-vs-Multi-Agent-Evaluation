groups:
  - name: archeval
    rules:
      - alert: CostPerAnswerHigh
        # Mean model spend per answer over 15 minutes, per architecture actually run.
        expr: |
          sum by (ran_as) (rate(archeval_cost_usd_total[15m]))
            / sum by (ran_as) (rate(archeval_requests_total[15m])) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Cost per answer above $0.05 for {{ $labels.ran_as }}"
      - alert: UngroundedAnswersRising
        expr: |
          sum(rate(archeval_ungrounded_answers_total[15m]))
            / sum(rate(archeval_requests_total[15m])) > 0.02
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "More than 2% of answers have unknown or missing citations"
      - alert: MultiAgentShareJump
        # The router suddenly sending far more traffic to orchestrator-worker is a cost risk.
        expr: |
          sum(rate(archeval_requests_total{ran_as=~"multi.*"}[1h]))
            / sum(rate(archeval_requests_total[1h])) > 0.7
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Over 70% of answers are going to the multi-agent path"
